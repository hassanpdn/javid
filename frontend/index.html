<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#25293c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>دستیار هوشمند مدرسه</title>
<meta name="description" content="Pudineh Agent Center: a demo of AI assistants for schools and businesses. Sign in to see the assistants.">
<!-- the Pudineh mark: SVG for browsers that take it, a PNG for the rest, and the home-screen icon for phones -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
  // Apply the saved light/dark theme before anything paints, so the page never flashes
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark") } catch {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
